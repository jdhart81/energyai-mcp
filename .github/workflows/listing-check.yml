name: Listing check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: One tool count across README, llms.txt and manifests
        run: node scripts/check-listing.mjs
